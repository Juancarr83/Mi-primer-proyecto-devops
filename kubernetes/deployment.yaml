apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-test-app-deployment
  labels:
    app: devops-test-app
spec:
  replicas: 2 # Mantiene 2 pods idénticos en ejecución para alta disponibilidad
  selector:
    matchLabels:
      app: devops-test-app
  template:
    metadata:
      labels:
        app: devops-test-app
    spec:
      containers:
      - name: devops-test-app
        image: devops-test-app:latest # Nombre de la imagen Docker que construimos
        imagePullPolicy: IfNotPresent # Usa la imagen local si existe (ideal para pruebas con Minikube/Kind)
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
            # 🩺 Sonda de disponibilidad (indica cuándo el pod puede recibir tráfico)
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5  # Espera 5 segundos antes de la primera comprobación
          periodSeconds: 10       # Repite la comprobación cada 10 segundos
        # 💓 Sonda de vida (indica si el contenedor sigue funcionando correctamente)
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15 # Espera 15 segundos a que la app arranque por completo
          periodSeconds: 20       # Comprueba el estado cada 20 segundos